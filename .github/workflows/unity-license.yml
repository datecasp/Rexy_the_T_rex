name: Activate Unity license

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request-activation:
    name: Request Unity activation file
    runs-on: ubuntu-latest
    steps:
      - name: Request Unity activation file
        uses: game-ci/unity-request-activation-file@v2

      - name: Upload activation file
        uses: actions/upload-artifact@v4
        with:
          name: unity-activation
          path: "*.ulf"
          retention-days: 7
          if-no-files-found: error

      - name: Activation instructions
        run: |
          echo "Descarga el artefacto unity-activation, súbelo a https://license.unity3d.com/manual y descarga el ULF generado."
          echo "Convierte el ULF a base64 y guárdalo como el secreto UNITY_LICENSE."
