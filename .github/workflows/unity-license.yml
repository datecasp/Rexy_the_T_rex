name: Activate Unity license

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  request-activation:
    name: Request Unity activation file
    runs-on: ubuntu-latest

    steps:
      - name: Request Unity activation instructions
        run: |
          echo "Unity Personal CI activation is no longer supported by the old"
          echo "game-ci/unity-request-activation-file@v2 action."
          echo
          echo "The license for this repository must be activated according to the"
          echo "current GameCI Personal license instructions:"
          echo "https://game.ci/docs/github/activation"

      - name: Document required Unity license secret
        run: |
          echo "After obtaining an activation file (ULF), convert it to base64 and store"
          echo "it as the UNITY_LICENSE repository secret:"
          echo "GitHub repository -> Settings -> Secrets and variables -> Actions"
          echo
          echo "Do not commit the ULF or base64 license contents to the repository."

      - name: Verify UNITY_LICENSE is configured
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "::error::UNITY_LICENSE is not configured. Add the Personal license ULF to repository secrets before running Unity builds."
            exit 1
          fi
          echo "UNITY_LICENSE is configured as a repository secret."
